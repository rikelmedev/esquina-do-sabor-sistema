<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV Esquina do Sabor</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #0f172a; display: flex; min-height: 100vh; overflow: hidden; }
        
        /* Menu Lateral */
        .sidebar { width: 260px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 20px; }
        .sidebar-brand { font-size: 1.5rem; color: #3b82f6; margin-bottom: 40px; text-align: center; }
        .nav-link { padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 10px; margin-bottom: 5px; cursor: pointer; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: #3b82f6; color: white; }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s; }

        .mesa-grid-admin { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand">ESQUINA PDV</div>
        <nav>
            <div class="nav-link active" onclick="switchView('v-dashboard')">📊 Dashboard</div>
            <div class="nav-link" onclick="switchView('v-mesas')">🍽️ Gestão de Mesas</div>
            <div class="nav-link" onclick="switchView('v-delivery')">🛵 Delivery & Retirada</div>
            <div class="nav-link" onclick="switchView('v-config')">⚙️ Configurações</div>
        </nav>
    </aside>

    <main class="main-content">
        
        <section id="v-dashboard" class="view-section active">
            <h1>Visão Geral</h1>
            <div id="stats" class="kpi-grid"></div>
        </section>

        <section id="v-mesas" class="view-section">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <h1>Mapa de Mesas</h1>
                <button class="finalize-order-btn" style="width: auto; padding: 10px 20px;">+ Lançar Pedido Manual</button>
            </div>
            <div id="mesa-grid-admin" class="mesa-grid-admin">
                </div>
        </section>

        <section id="v-delivery" class="view-section">
            <h1>Pedidos de Saída</h1>
            <div class="admin-container">
                <div class="column"><h2>📥 Pendentes</h2><div id="col-pendente"></div></div>
                <div class="column"><h2>👨‍🍳 Preparando</h2><div id="col-preparando"></div></div>
                <div class="column"><h2>✅ Finalizados</h2><div id="col-finalizado"></div></div>
            </div>
        </section>

        <section id="v-config" class="view-section">
            <h1>Conectar Dispositivos</h1>
            <div class="kpi-card" style="margin-top: 20px;">
                <p>Para conectar smartphones de garçons, aponte a câmera para o QR Code ou acesse a URL abaixo:</p>
                <code id="url-garcom" style="display: block; background: #0f172a; padding: 15px; margin-top: 10px; border-radius: 8px;"></code>
            </div>
        </section>

    </main>

    <script type="module" src="admin.js"></script>
</body>
</html>
