<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Esquina do Sabor</title>
    <link rel="stylesheet" href="styles.css"> 
    
    <style>
        /* Para organizar as colunas de pedidos */
        .admin-container { 
            display: flex; 
            gap: 20px; 
            padding: 20px; 
            overflow-x: auto; 
            min-height: 80vh; 
        }
        .column { 
            background: #1a1a1a; 
            min-width: 320px; 
            border-radius: 10px; 
            padding: 15px; 
            border: 1px solid #333; 
        }
        .column h2 { 
            font-size: 1.5rem; 
            text-align: center; 
            margin-bottom: 20px; 
            color: var(--color-yellow-flame); 
        }
        .order-card { 
            background: #2a2a2a; 
            border-radius: 8px; 
            padding: 15px; 
            margin-bottom: 15px; 
            border-left: 5px solid var(--color-red-fire); 
        }
        /* Cores diferentes para cada estágio do pedido */
        .order-card.preparando { border-left-color: #3498db; }
        .order-card.finalizado { border-left-color: var(--whatsapp-green); opacity: 0.7; }
        
        .order-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; }
        .order-items { font-size: 0.9rem; margin-bottom: 10px; border-top: 1px solid #444; padding-top: 10px; }
        
        .admin-btns { display: flex; gap: 5px; }
        .admin-btns button { 
            flex: 1; 
            padding: 8px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            color: white; 
        }
        .btn-accept { background: #3498db; }
        .btn-done { background: var(--whatsapp-green); }
        .btn-cancel { background: #e74c3c; }
    </style>
</head>
<body style="background: #111;">

    <header class="header">
        <div class="container" style="text-align: center;">
            <h1>Painel de Pedidos</h1>
            <div id="stats" style="color: #ccc; margin-top: 10px;">Aguardando novos pedidos...</div>
        </div>
    </header>

    <div class="admin-container">
        <div class="column">
            <h2>📥 Pendentes</h2>
            <div id="col-pendente"></div>
        </div>

        <div class="column">
            <h2>👨‍🍳 Preparando</h2>
            <div id="col-preparando"></div>
        </div>

        <div class="column">
            <h2>✅ Finalizados</h2>
            <div id="col-finalizado"></div>
        </div>
    </div>

    <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

    <script type="module" src="admin.js"></script>
</body>
</html>
