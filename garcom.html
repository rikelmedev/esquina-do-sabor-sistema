<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App do Garçom - Esquina do Sabor</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .mesa-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .mesa-card {
            background: #2a2a2a;
            border-radius: 12px;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid #444;
            transition: transform 0.2s;
        }
        .mesa-card:active { transform: scale(0.95); }
        .mesa-card.livre { border-color: #2ecc71; }
        .mesa-card.ocupada { border-color: var(--color-red-fire); background: #3d1010; }
        .mesa-numero { font-size: 2.5rem; font-family: 'Teko', sans-serif; }
        .mesa-status { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body style="background: #111;">

    <header class="header">
        <div class="container" style="text-align: center;">
            <h1 style="font-size: 2.5rem;">Mapa de Mesas</h1>
            <p style="color: var(--text-secondary);">Selecione uma mesa para iniciar o pedido</p>
        </div>
    </header>

    <main class="container">
        <div id="mesa-grid" class="mesa-grid">
            </div>
    </main>

    <div id="mesa-modal" class="modal">
    <div class="modal-content">
        <span class="close-button" onclick="fecharModal()">&times;</span>
        <h2 id="modal-titulo-mesa">Mesa</h2>
        
        <div style="margin-top: 15px;">
            <label style="color: var(--color-yellow-flame); font-size: 0.9rem;">Número da Mesa:</label>
            <input type="number" id="input-numero-mesa" style="width: 100%; padding: 10px; background: #444; color: white; border: 1px solid #666; border-radius: 5px; margin-top: 5px;">
        </div>

        <div id="itens-consumo" style="margin: 20px 0; border-bottom: 1px solid #444; padding-bottom: 10px;">
            </div>

            <h2 id="modal-titulo-mesa">Gestão de Mesa</h2>

<div style="margin-top: 15px;">
    <label style="color: var(--color-yellow-flame); font-size: 0.9rem;">Número da Mesa:</label>
    <input type="number" id="input-numero-mesa" style="width: 100%; padding: 10px; background: #444; color: white; border: 1px solid #666; border-radius: 5px; margin-top: 5px;">
</div>

<div id="itens-consumo" style="margin: 20px 0; border-bottom: 1px solid #444; padding-bottom: 10px;">
    <p style="font-size: 0.8rem; color: #888;">Consumo atual:</p>
    </div>

<div id="area-produtos" style="margin-top: 15px; display: none;">
    <label style="color: var(--color-yellow-flame); font-size: 0.9rem;">Adicionar ao Pedido:</label>
    <select id="select-produto" style="width: 100%; padding: 12px; background: #333; color: white; border: 1px solid var(--color-yellow-flame); border-radius: 8px; margin-top: 5px; font-size: 16px;">
    <option value="">Escolha um produto...</option>
    
    <optgroup label="🍔 LANCHES E BURGUER'S">
        <option value="19.00">X-Burguer - R$ 19,00</option>
        <option value="20.00">X-Salada - R$ 20,00</option>
        <option value="28.00">X-Tudo - R$ 28,00</option>
        <option value="31.00">Filé Tudo - R$ 31,00</option>
    </optgroup>

    <optgroup label="🌭 HOT DOG'S">
        <option value="12.00">Dog Tradicional - R$ 12,00</option>
        <option value="22.00">Dog Especial - R$ 22,00</option>
    </optgroup>

    <optgroup label="🍟 PORÇÕES">
        <option value="27.00">Calabresa Acebolada (Meia) - R$ 27,00</option>
        <option value="38.00">Calabresa Acebolada (Inteira) - R$ 38,00</option>
        <option value="24.00">Batata Frita (Inteira) - R$ 24,00</option>
    </optgroup>

    <optgroup label="✨ ADICIONAIS">
        <option value="8.00">Adicional Bacon - R$ 8,00</option>
        <option value="3.00">Adicional Ovo - R$ 3,00</option>
    </optgroup>

    <optgroup label="🥤 BEBIDAS">
        <option value="6.00">Refrigerante Lata - R$ 6,00</option>
        <option value="10.00">Cerveja Heineken - R$ 10,00</option>
        <option value="15.00">Refrigerante 2L - R$ 15,00</option>
    </optgroup>
</select>
    <button onclick="adicionarItemMesa()" class="finalize-order-btn" style="background: #2ecc71; color: white; margin-top: 10px;">+ Lançar Item</button>
</div>

<div id="area-acoes" style="margin-top: 20px;">
    </div>

        <div id="area-acoes">
            </div>
    </div>
</div>

    <script type="module" src="garcom.js"></script>
</body>
</html>
