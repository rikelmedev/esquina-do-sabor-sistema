<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App do Garçom - Esquina do Sabor</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .mesa-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .mesa-card {
            background: #2a2a2a;
            border-radius: 12px;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid #444;
            transition: transform 0.2s;
        }
        .mesa-card:active { transform: scale(0.95); }
        .mesa-card.livre { border-color: #2ecc71; }
        .mesa-card.ocupada { border-color: var(--color-red-fire); background: #3d1010; }
        .mesa-numero { font-size: 2.5rem; font-family: 'Teko', sans-serif; }
        .mesa-status { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body style="background: #111;">

    <header class="header">
        <div class="container" style="text-align: center;">
            <h1 style="font-size: 2.5rem;">Mapa de Mesas</h1>
            <p style="color: var(--text-secondary);">Selecione uma mesa para iniciar o pedido</p>
        </div>
    </header>

    <main class="container">
        <div id="mesa-grid" class="mesa-grid">
            </div>
    </main>

    <div id="mesa-modal" class="modal">
    <div class="modal-content">
        <span class="close-button" onclick="fecharModal()">&times;</span>
        <h2 id="modal-titulo-mesa">Mesa</h2>
        
        <div style="margin-top: 15px;">
            <label style="color: var(--color-yellow-flame); font-size: 0.9rem;">Número da Mesa:</label>
            <input type="number" id="input-numero-mesa" style="width: 100%; padding: 10px; background: #444; color: white; border: 1px solid #666; border-radius: 5px; margin-top: 5px;">
        </div>

        <div id="itens-consumo" style="margin: 20px 0; border-bottom: 1px solid #444; padding-bottom: 10px;">
            </div>

        <div id="area-acoes">
            </div>
    </div>
</div>

    <script type="module" src="garcom.js"></script>
</body>
</html>
